<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>观晋｜看懂山西古建筑</title>
    <meta name="description" content="出发前看懂山西古建筑：它是什么，特点是什么，价值在哪里。" />
  </head>
  <body>
    <header class="site-header">
      <h1>观晋</h1>
      <p>看懂山西古建筑</p>
    </header>
    <main>
      <div class="stage-wrap">
        <canvas id="stage" aria-label="屋顶变形器的三维示意"></canvas>
        <p class="hint">按住鼠标拖动可以旋转，滚轮缩放</p>
      </div>

      <aside class="panel">
        <h2>屋顶变形器 <span class="badge">示意</span></h2>

        <div class="result" aria-live="polite">
          <p class="result-label">现在的屋顶</p>
          <p id="form-name" class="result-name"></p>
          <p id="form-parts" class="result-parts"></p>
          <p id="form-desc" class="desc"></p>
        </div>

        <section>
          <h3><span class="step">1</span>先定基本形：屋顶两端怎么收</h3>
          <input id="form" type="range" min="0" max="130" step="any" value="0" aria-label="基本形" />
          <div class="ticks">
            <button type="button" data-for="form" data-value="0">庑殿</button>
            <button type="button" data-for="form" data-value="45">歇山</button>
            <button type="button" data-for="form" data-value="100">悬山</button>
            <button type="button" data-for="form" data-value="130">硬山</button>
          </div>
          <p id="form-how" class="how">滑块控制两端的山面从多高开始变成直立的三角形。从屋脊开始是庑殿，从檐口开始是悬山，中间是歇山。再把两端的出挑收回，就是硬山。</p>
          <button type="button" class="switch" role="switch" aria-checked="false" data-branch="zj">
            <span class="sw-text">
              <span class="sw-name">攒尖</span>
              <span class="sw-desc">另一种基本形：平面收成正方形，四面坡汇成一个尖</span>
            </span>
            <span class="sw-knob"></span>
          </button>
        </section>

        <section>
          <h3><span class="step">2</span>再加变化（可选，可以叠加）</h3>
          <button type="button" class="switch" role="switch" aria-checked="false" data-branch="dbl">
            <span class="sw-text">
              <span class="sw-name">重檐</span>
              <span class="sw-desc" data-off="悬山、硬山不用重檐">殿身外加一圈廊，多一层屋檐</span>
            </span>
            <span class="sw-knob"></span>
          </button>
          <button type="button" class="switch" role="switch" aria-checked="false" data-branch="jp">
            <span class="sw-text">
              <span class="sw-name">卷棚</span>
              <span class="sw-desc" data-off="庑殿、攒尖不用卷棚，先把基本形换成歇山、悬山或硬山">去掉正脊，前后两坡在顶部圆滑相接</span>
            </span>
            <span class="sw-knob"></span>
          </button>
        </section>

        <section>
          <h3><span class="step">3</span>换个时代看</h3>
          <div class="row">
            <span class="label">时代</span>
            <output id="era-name" for="era"></output>
          </div>
          <input id="era" type="range" min="0" max="100" step="any" value="0" aria-label="时代" />
          <div class="ticks">
            <button type="button" data-for="era" data-value="0">唐</button>
            <button type="button" data-for="era" data-value="40">宋辽金</button>
            <button type="button" data-for="era" data-value="70">元</button>
            <button type="button" data-for="era" data-value="100">明清</button>
          </div>
          <dl class="readout">
            <dt>屋面</dt><dd id="era-slope"></dd>
            <dt>出檐</dt><dd id="era-eave"></dd>
            <dt>斗拱</dt><dd id="era-bracket"></dd>
          </dl>
        </section>

        <footer class="sources">
          <p>这是说明趋势的示意模型，数值是近似值，不是某座建筑的测绘数据。</p>
          <p>依据：形制与等级见梁思成《清式营造则例》；时代变化见梁思成《图像中国建筑史》。斗拱只表现层层出挑的轮廓，不对应具体做法。</p>
        </footer>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
