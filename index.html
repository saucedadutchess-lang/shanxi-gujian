<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>观晋｜看懂山西古建筑</title>
    <meta name="description" content="出发前看懂山西古建筑：它是什么，特点是什么，价值在哪里。" />
  </head>
  <body>
    <header class="site-header">
      <h1>观晋</h1>
      <p>看懂山西古建筑</p>
    </header>
    <main>
      <div class="stage-wrap">
        <canvas id="stage" aria-label="屋顶变形器的三维示意"></canvas>
        <p class="hint">按住鼠标拖动可以旋转，滚轮缩放</p>
      </div>

      <aside class="panel">
        <h2>屋顶变形器 <span class="badge">示意</span></h2>
        <p class="lead">古建筑的屋顶看起来种类很多，其实是同一个屋顶在两个方向上的变化。拖动滑块看看。</p>

        <section>
          <div class="row">
            <label for="form">形制</label>
            <output id="form-name" for="form"></output>
          </div>
          <input id="form" type="range" min="0" max="130" step="any" value="0" />
          <div class="ticks">
            <button type="button" data-for="form" data-value="0">庑殿</button>
            <button type="button" data-for="form" data-value="45">歇山</button>
            <button type="button" data-for="form" data-value="100">悬山</button>
            <button type="button" data-for="form" data-value="130">硬山</button>
          </div>
          <p id="form-desc" class="desc"></p>
          <p class="how">滑块控制的是：两端的山面从多高开始变成直立的三角形。从屋脊开始就是庑殿，从檐口开始就是悬山，中间是歇山。再把两端的出挑收回，就是硬山。</p>
        </section>

        <section>
          <div class="row">
            <span class="label">变化</span>
          </div>
          <div class="branches">
            <button type="button" data-branch="dbl" aria-pressed="false">重檐</button>
            <button type="button" data-branch="jp" aria-pressed="false">卷棚</button>
            <button type="button" data-branch="zj" aria-pressed="false">攒尖</button>
          </div>
          <p class="how">重檐只用于庑殿、歇山和攒尖；卷棚只用于歇山、悬山和硬山。不能用的时候按钮是灰的。</p>
        </section>

        <section>
          <div class="row">
            <label for="era">时代</label>
            <output id="era-name" for="era"></output>
          </div>
          <input id="era" type="range" min="0" max="100" step="any" value="0" />
          <div class="ticks">
            <button type="button" data-for="era" data-value="0">唐</button>
            <button type="button" data-for="era" data-value="40">宋辽金</button>
            <button type="button" data-for="era" data-value="70">元</button>
            <button type="button" data-for="era" data-value="100">明清</button>
          </div>
          <dl class="readout">
            <dt>屋面</dt><dd id="era-slope"></dd>
            <dt>出檐</dt><dd id="era-eave"></dd>
            <dt>斗拱</dt><dd id="era-bracket"></dd>
          </dl>
        </section>

        <footer class="sources">
          <p>这是说明趋势的示意模型，数值是近似值，不是某座建筑的测绘数据。</p>
          <p>依据：形制与等级见梁思成《清式营造则例》；时代变化见梁思成《图像中国建筑史》。斗拱只表现层层出挑的轮廓，不对应具体做法。</p>
        </footer>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
